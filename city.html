<title>Shafik City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;900&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Concept: one isometric island. Each building is a project and the city is alive (traffic, smoke, alerts, a day/night cycle). UI is dark glass floating over the map. Teal = data, coral = people/alerts, amber = signals. */
:root{
  --bg:#0A1226; --glass:rgba(9,14,28,.86); --ink:#F3EFE6; --muted:#A2ACBF; --line:rgba(243,239,230,.15);
  --teal:#3DDBB0; --coral:#FF6B57; --amber:#FFC857;
  --f-display:'Gabarito','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#city{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0}
#city.grabbing{cursor:grabbing}#city.point{cursor:pointer}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;overflow-wrap:break-word}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

/* top bar */
.bar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;border-radius:999px;padding:9px 16px 9px 12px;text-decoration:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:1.02rem;letter-spacing:-.01em}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--teal);transform:rotate(45deg);box-shadow:0 0 0 4px rgba(61,219,176,.2)}
.right{display:flex;gap:8px;align-items:center}
.live{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;color:var(--ink)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,219,176,.6)}70%{box-shadow:0 0 0 9px rgba(61,219,176,0)}100%{box-shadow:0 0 0 0 rgba(61,219,176,0)}}
.seg{display:inline-flex;border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:600 .8rem var(--f-body);padding:8px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0A1226}
@media(max-width:700px){.live{display:none}}

/* zoom */
.zoom{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));top:calc(68px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
.zoom button{width:42px;height:42px;background:none;border:0;color:var(--ink);font:500 1.3rem var(--f-body);cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:rgba(255,255,255,.08)}

/* intro */
.intro{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:420px;border-radius:22px;padding:24px 26px}
.intro .mono{display:block;margin-bottom:12px;color:var(--teal)}
.intro h1{font-weight:900;font-size:clamp(2rem,5vw,3rem);line-height:1;letter-spacing:-.03em}
.intro p{margin-top:12px;color:var(--muted)}
.intro p b{color:var(--ink);font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 .92rem var(--f-body);padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--teal);border-color:var(--teal);color:#04140F}
.btn.go:hover{filter:brightness(1.1)}
@media(max-width:700px){.intro{right:max(16px,env(safe-area-inset-right,0px));max-width:none;padding:16px 20px}.intro p{display:none}.intro .cta{margin-top:14px}.intro h1{font-size:1.9rem}}

/* panel */
.panel{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 32px));overflow:auto;border-radius:22px;padding:26px;overscroll-behavior:contain}
.panel[hidden]{display:none}
.panel .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.15rem;cursor:pointer}
.panel .x:hover{border-color:var(--ink)}
.kick{display:block;margin-bottom:12px;padding-right:40px}
.panel h2{font-weight:900;font-size:clamp(1.6rem,3vw,2.15rem);line-height:1.04;letter-spacing:-.025em;padding-right:34px}
.panel .body{margin-top:14px;color:var(--muted)}
.panel .body b{color:var(--ink);font-weight:600}
.pts{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:9px}
.pts li{display:flex;gap:12px;font-size:.95rem}
.pts li::before{content:"";flex:none;width:16px;height:2px;background:var(--acc,var(--teal));margin-top:.8em;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.chips span{font:400 .74rem var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.04)}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.mail code{font:500 .9rem var(--f-mono);border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.04);user-select:all;overflow-wrap:anywhere}
.lnk{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px}
.lnk a{font-weight:700;text-decoration:none;border-bottom:2px solid var(--teal);padding-bottom:2px}
.lnk a:hover{color:var(--teal)}
.stepper{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.stepper .btn{padding:9px 16px;font-size:.85rem}
@media(max-width:700px){.panel{top:auto;max-height:54svh;padding:22px}}

/* dock */
.dock{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;max-width:calc(100vw - 24px);overflow-x:auto;border-radius:999px;padding:6px;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{flex:none;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font:600 .84rem var(--f-body);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.dock button i{width:9px;height:9px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.dock button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.dock button[aria-pressed="true"]{color:#0A1226;background:var(--ink)}
.tip{position:fixed;z-index:8;pointer-events:none;padding:6px 12px;border-radius:10px;font:600 .82rem var(--f-body);transform:translate(14px,14px)}
.tip[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.live::before{animation:none}}
</style>

<canvas id="city" aria-label="Interactive isometric city. Each building is a project. Use the buttons at the bottom to visit them."></canvas>

<header class="bar">
  <a class="brand glass" href="#"><i></i><b>Shafik City</b></a>
  <div class="right">
    <span class="live glass mono" style="color:var(--ink)">Open to work</span>

      <button type="button" data-m="night" aria-pressed="false">Night</button>
      <button type="button" data-m="auto" aria-pressed="true">Auto</button>

</header>

<div class="zoom glass" role="group" aria-label="Zoom"><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zOut" aria-label="Zoom out">&minus;</button></div>

<section class="intro glass" id="intro">
  <span class="mono">Portfolio &middot; Nagori Shafik</span>
  <h1>Welcome to Shafik City.</h1>
  <p>A living map of what I build. Every building is a real project: <b>data platforms, causal AI, safety alerts and ML pipelines</b>. Click a building, or take the tour.</p>
  <div class="cta"><button class="btn go" id="tourBtn" type="button">Start the tour</button><button class="btn" id="freeBtn" type="button">Explore freely</button></div>
</section>

<aside class="panel glass" id="panel" hidden aria-live="polite">
  <button class="x" id="pClose" type="button" aria-label="Close">&times;</button>
  <span class="kick mono" id="pKick"></span>
  <h2 id="pTitle"></h2>
  <p class="body" id="pBody"></p>
  <ul class="pts" id="pPts"></ul>
  <div class="chips" id="pChips"></div>
  <div id="pExtra"></div>
  <div class="stepper"><button class="btn" id="pPrev" type="button">&larr; Previous</button><button class="btn go" id="pNext" type="button">Next &rarr;</button></div>
</aside>

<nav class="dock glass" id="dock" aria-label="Districts"></nav>
<div class="tip glass" id="tip" hidden></div>

<script>
(function(){
'use strict';
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id)}
var TW=64,TH=32,N=17;
var cv=$('city'),cx=cv.getContext('2d');
var W=0,H=0,D=1,k=.6,fit=.6,camX=0,camY=190,tk=null,night=0,mode='auto',t=reduce?3:0,dirty=true,hover=null,sel=null,tourOn=false;

/* ---------- helpers ---------- */
function iso(x,y,z){return[(x-y)*TW/2,(x+y)*TH/2-(z||0)]}
function rgb(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,u){return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]}
function css(c,a){return'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')'}
function tone(d,n){return css(mix(rgb(d),rgb(n),night))}
function lit(h,f){
  var c=rgb(h),df=[1,.84,.68][f],nf=[.42,.32,.26][f],m=df+(nf-df)*night;
  return css(mix([c[0]*m,c[1]*m,c[2]*m],[22,34,80],night*.28));
}
function hh(a,b,c){var s=Math.sin(a*127.1+b*311.7+c*74.7+1.3)*43758.5453;return s-Math.floor(s)}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function poly(p,fill,stroke,lw){
  cx.beginPath();for(var i=0;i<p.length;i++){if(i)cx.lineTo(p[i][0],p[i][1]);else cx.moveTo(p[i][0],p[i][1])}cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw||1;cx.stroke()}
}
function box(x,y,w,d,h,z,hex,top){
  var A=iso(x,y,z+h),B=iso(x+w,y,z+h),C=iso(x+w,y+d,z+h),Dd=iso(x,y+d,z+h),Cg=iso(x+w,y+d,z),Dg=iso(x,y+d,z),Bg=iso(x+w,y,z);
  poly([Dd,C,Cg,Dg],lit(hex,1));poly([C,B,Bg,Cg],lit(hex,2));poly([A,B,C,Dd],lit(top||hex,0));
}
function roof(x,y,w,d,z,hgt,hex){
  var ap=iso(x+w/2,y+d/2,z+hgt),Dd=iso(x,y+d,z),C=iso(x+w,y+d,z),B=iso(x+w,y,z);
  poly([Dd,C,ap],lit(hex,1));poly([C,B,ap],lit(hex,2));
}
function band(x,y,w,d,z0,z1,hex){
  poly([iso(x,y+d,z0),iso(x+w,y+d,z0),iso(x+w,y+d,z1),iso(x,y+d,z1)],lit(hex,1));
  poly([iso(x+w,y+d,z0),iso(x+w,y,z0),iso(x+w,y,z1),iso(x+w,y+d,z1)],lit(hex,2));
}
function winQuad(p0,p1,z0,z1,fill){poly([iso(p0[0],p0[1],z0),iso(p1[0],p1[1],z0),iso(p1[0],p1[1],z1),iso(p0[0],p0[1],z1)],fill)}
function windows(face,fixed,a0,a1,z0,z1,rows,cols,seed){
  var gw=(a1-a0)/cols,gh=(z1-z0)/rows;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var u0=a0+(c+.2)*gw,u1=a0+(c+.8)*gw,q0=z0+(r+.22)*gh,q1=z0+(r+.78)*gh,on=hh(seed,r,c)>.42;
    var fill=css(mix(rgb('#8FB3C7'),on?[255,214,130]:[36,48,84],night));
    if(face==='L')winQuad([u0,fixed],[u1,fixed],q0,q1,fill);else winQuad([fixed,u0],[fixed,u1],q0,q1,fill);
  }
}
function hexPoly(x,y,w,d,h,z){z=z||0;return[iso(x,y,z+h),iso(x+w,y,z+h),iso(x+w,y,z),iso(x+w,y+d,z),iso(x,y+d,z),iso(x,y+d,z+h)]}
function inPoly(p,pt){var c=false;for(var i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>pt[1])!==(p[j][1]>pt[1]))&&(pt[0]<(p[j][0]-p[i][0])*(pt[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c}return c}

/* ---------- map data ---------- */
var tile=[];for(var ty=0;ty<N;ty++){tile[ty]=[];for(var tx=0;tx<N;tx++)tile[ty][tx]=0}
for(var rx=0;rx<N;rx++)tile[8][rx]=1;
for(var ry=3;ry<=14;ry++)tile[ry][8]=1;
for(var py=6;py<=10;py++)for(var px=6;px<=10;px++)if(!tile[py][px])tile[py][px]=2;
for(var bx=2;bx<=5;bx++)tile[7][bx]=3;
for(var bx2=1;bx2<=7;bx2++)tile[13][bx2]=3;
var occ=[];for(var oy=0;oy<N;oy++){occ[oy]=[];for(var ox=0;ox<N;ox++)occ[oy][ox]=tile[oy][ox]?1:0}
function reserve(x,y,w,d){for(var yy=Math.floor(y)-1;yy<=Math.ceil(y+d);yy++)for(var xx=Math.floor(x)-1;xx<=Math.ceil(x+w);xx++)if(occ[yy]&&occ[yy][xx]!==undefined)occ[yy][xx]=1}
[[2,4,4,3],[10,4,3,3],[2,10,4,3],[11,10,2,2],[14,10,2,1],[14,13,2,2],[6,0,5,3],[7,15,3,2]].forEach(function(r){reserve(r[0],r[1],r[2],r[3])});

var B={
  town:{id:'town',name:'Town Hall',col:'#F3EFE6',x:6,y:0,w:5,d:3,hit:150,polys:[hexPoly(6,0,5,3,50),hexPoly(7.7,.8,1.6,1.6,150)]},
  data:{id:'data',name:'Data Works',col:'#3DDBB0',x:2,y:4,w:4,d:3,hit:70,polys:[hexPoly(2,4,4,3,62)]},
  obs:{id:'obs',name:'Fairness Observatory',col:'#7FB2FF',x:10,y:4,w:3,d:3,hit:190,polys:[hexPoly(10,4,3,3,62),hexPoly(11,5,1,1,175)]},
  alert:{id:'alert',name:'Alert Tower',col:'#FF6B57',x:11,y:10,w:2,d:2,hit:200,polys:[hexPoly(11,10,2,2,36),hexPoly(11.5,10.5,1,1,205)]},
  refinery:{id:'refinery',name:'The Refinery',col:'#FFC857',x:2,y:10,w:4,d:3,hit:92,polys:[hexPoly(2,10,4,3,50),hexPoly(3,10,2.4,1,95)]},
  post:{id:'post',name:'Post Office',col:'#FF9C8A',x:7,y:15,w:3,d:2,hit:40,polys:[hexPoly(7,15,3,2,40)]}
};
var ORDER=['town','data','obs','alert','refinery','post'];
var INFO={
  town:{kick:'Town Hall · About',title:'Nagori Shafik',acc:'#F3EFE6',
    body:'A <b>software engineer</b> who puts machine learning inside production applications. I was a Full-Stack Developer at Proses Web Technologies and I am finishing an <b>MSc in Data &amp; Artificial Intelligence</b> at UWTSD, after an MCA at Ganpat University.',
    pts:['UK right to work (Graduate Route)','Available full-time, immediate start','English, Hindi, Gujarati'],
    chips:['Python','TypeScript','JavaScript','SQL','Java','scikit-learn','TensorFlow','Node.js','Express','React','Angular','MySQL','PostgreSQL','MongoDB','REST','JWT / OAuth','TDD','CI/CD','Git','Agile']},
  data:{kick:'Enterprise data platform · Proses Web Technologies, 2021 to 2022',title:'Data Works',acc:'#3DDBB0',
    body:'An ERP and stock platform I delivered end to end: an <b>Angular</b> front end, a <b>Node.js and Express</b> API and optimised <b>MySQL</b> schemas.',
    pts:['Custom ETL workflows automated data extraction and loading','Real-time stock sync with third-party APIs and automated alerts','Analytics dashboards and automated reporting','Built with TDD, code review and continuous integration'],
    chips:['Angular','Node.js','Express','MySQL','REST','ETL','TDD']},
  obs:{kick:'Causal AI for fair and transparent credit risk',title:'Fairness Observatory',acc:'#7FB2FF',
    body:'I compared <b>Logistic Regression, Random Forest and Gradient Boosting</b>, then built a causal framework with DAGs and counterfactual reasoning to evaluate how each model behaves and whether it is fair.',
    pts:['Three model families built and evaluated','DAGs to map cause and effect between features','Counterfactuals to test model behaviour'],
    chips:['Python','scikit-learn','Causal inference','Fairness','Model evaluation']},
  alert:{kick:'Women’s Safety Emergency Alert System',title:'Alert Tower',acc:'#FF6B57',
    body:'The emergency-response core of a personal safety app. One trigger sends an SMS, through an integrated service, to <b>police and family contacts</b>.',
    pts:['Live location included in every alert','Battery status and user details attached','Built for speed when seconds matter'],
    chips:['SMS integration','Live location','Real-time alerts']},
  refinery:{kick:'MSc dissertation · UWTSD Birmingham',title:'The Refinery',acc:'#FFC857',
    body:'My dissertation explores <b>hybrid ML models for product data enrichment</b>. ETL pipelines and automated feature engineering turn messy product records into clean features a model can learn from.',
    pts:['ETL pipelines for inconsistent product data','Automated feature engineering','Coursework in ML, NLP, data engineering, distributed systems and AI ethics'],
    chips:['ETL','Feature engineering','NLP','Data engineering','Distributed systems','AI ethics']},
  post:{kick:'Post Office · Contact',title:'Send me a letter',acc:'#FF9C8A',
    body:'I am looking for a full-time role in AI and software engineering with an <b>immediate start</b>. I have UK right to work on the Graduate Route.',
    pts:[],chips:[],contact:true}
};

/* scenery */
var rnd=rng(77),trees=[],houses=[],hcol=['#F2C9A8','#BFD7EA','#EBD98F','#D9B8C9','#B9DCC0'];
for(var sy=0;sy<N;sy++)for(var sx=0;sx<N;sx++){
  if(occ[sy][sx])continue;var r=rnd();
  if((sx<=1||sx>=15)&&r<.34)houses.push({x:sx+.1,y:sy+.1,c:hcol[Math.floor(rnd()*hcol.length)],s:rnd()});
  else if(r<.2)trees.push({x:sx,y:sy,s:.8+rnd()*.5,p:rnd()*6});
}
var cars=[
  {ax:'x',lane:8.3,dir:1,pos:2,sp:1.7,c:'#FF6B57'},{ax:'x',lane:8.3,dir:1,pos:11,sp:1.2,c:'#F3EFE6'},
  {ax:'x',lane:8.7,dir:-1,pos:6,sp:1.5,c:'#3DDBB0'},{ax:'x',lane:8.7,dir:-1,pos:14,sp:1.9,c:'#FFC857'},
  {ax:'y',lane:8.3,dir:1,pos:4,sp:1.4,c:'#7FB2FF'},{ax:'y',lane:8.3,dir:1,pos:10,sp:1.8,c:'#F3EFE6'},
  {ax:'y',lane:8.7,dir:-1,pos:7,sp:1.3,c:'#FF6B57'},{ax:'y',lane:8.7,dir:-1,pos:13,sp:1.6,c:'#FFC857'}
];
var stars=[];for(var si=0;si<130;si++)stars.push({x:Math.random(),y:Math.random()*.7,r:.6+Math.random()*1.3,p:Math.random()*6});
var waves=[];var wr=rng(9);for(var wi=0;wi<80;wi++)waves.push({x:-780+wr()*1560,y:-120+wr()*820,p:wr()*6});
var clouds=[];for(var ci=0;ci<6;ci++)clouds.push({y:-80+ci*120,o:ci*290,s:6+ci*1.5});

/* ---------- ground ---------- */
function drawGround(){
  var a=iso(0,N,0),b=iso(N,N,0),c=iso(N,0,0);
  poly([a,b,[b[0],b[1]+20],[a[0],a[1]+20]],tone('#8C7B63','#1B2138'));

function update(dt){
  if(!reduce)t+=dt;
  var target;
  if(mode==='auto'){var tt=(t%90)/90;target=1-clamp(.5+.85*Math.cos(tt*6.2832),0,1)}else target=mode==='night'?1:0;
  night+=(target-night)*(reduce?1:Math.min(1,dt*2.2));
  if(!reduce)cars.forEach(function(c){var lo=c.ax==='x'?-1:2.6,hi=c.ax==='x'?18:14.9;c.pos+=c.dir*c.sp*dt;if(c.pos>hi)c.pos=lo;if(c.pos<lo)c.pos=hi});
  if(tk){
    var f=reduce?1:Math.min(1,dt*4.2);camX+=(tk.x-camX)*f;camY+=(tk.y-camY)*f;k+=(tk.k-k)*f;
    if(Math.abs(tk.x-camX)<.5&&Math.abs(tk.y-camY)<.5&&Math.abs(tk.k-k)<.003)tk=null;
  }
}
function clampCam(){camX=clamp(camX,-560,560);camY=clamp(camY,-60,560);k=clamp(k,fit*.7,2.4)}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!reduce||dirty||tk){update(dt);draw();dirty=false}
  requestAnimationFrame(frame);
}

/* ---------- layout ---------- */
function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;
  var f=Math.min(W/1100,H/760);fit=clamp(f,.28,1.3);
  if(!resize.done){k=W<700?Math.max(fit,.56):fit;camX=0;camY=W<700?245:185;resize.done=true}
  dirty=true;
}

/* ---------- UI ---------- */
var dock=$('dock'),dbtn={};
ORDER.forEach(function(id){
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed','false');b.style.setProperty('--c',B[id].col);
  b.innerHTML='<i></i>'+B[id].name;b.addEventListener('click',function(){select(id,true)});dock.appendChild(b);dbtn[id]=b;
});
var panel=$('panel'),intro=$('intro');
function esc(s){return s}
function select(id,fly){
  sel=id;tourOn=true;var b=B[id],inf=INFO[id];
  intro.hidden=true;
  $('pKick').textContent=inf.kick;$('pTitle').textContent=inf.title;$('pBody').innerHTML=inf.body;
  panel.style.setProperty('--acc',inf.acc);$('pKick').style.color=inf.acc;
  $('pPts').innerHTML=inf.pts.map(function(p){return'<li>'+p+'</li>'}).join('');
  $('pChips').innerHTML=inf.chips.map(function(c){return'<span>'+c+'</span>'}).join('');
  $('pExtra').innerHTML=inf.contact?'<div class="mail"><code id="mailText">nagorishafiq1996.se@gmail.com</code><button class="btn go" id="copyBtn" type="button">Copy email</button></div><div class="lnk"><a href="https://www.linkedin.com/in/nagori-shafik-9992b9165/" target="_blank" rel="noopener">LinkedIn</a><a href="https://github.com/NagoriShafik" target="_blank" rel="noopener">GitHub</a><a href="https://www.hackerrank.com/nagorishafiq1996" target="_blank" rel="noopener">HackerRank</a></div>':'';
  if(inf.contact)bindCopy();
  panel.hidden=false;panel.scrollTop=0;
  ORDER.forEach(function(o){dbtn[o].setAttribute('aria-pressed',o===id)});
  var cb=dbtn[id];if(cb&&cb.scrollIntoView)try{cb.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
  if(fly){
    var wc=iso(b.x+b.w/2,b.y+b.d/2,b.hit*.45),nk=clamp(Math.max(fit*1.5,W<700?.8:1),fit,2),px=0,py=0;
    if(W>900)px=(Math.min(410,W-32)/2+8)/nk;else py=(H*.2)/nk;
    tk={x:wc[0]+px,y:wc[1]+py,k:nk};
  }
  dirty=true;
}
function closePanel(){sel=null;panel.hidden=true;tourOn=false;ORDER.forEach(function(o){dbtn[o].setAttribute('aria-pressed','false')});dirty=true}
function step(d){var i=ORDER.indexOf(sel);i=(i+d+ORDER.length)%ORDER.length;select(ORDER[i],true)}
function bindCopy(){
  var btn=$('copyBtn'),mail=$('mailText');
  btn.addEventListener('click',function(){
    function done(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy email'},1600)}
    function fb(){var r=document.createRange();r.selectNodeContents(mail);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected, press copy'}
    try{navigator.clipboard.writeText(mail.textContent).then(done,fb)}catch(e){fb()}
  });
}
$('pClose').addEventListener('click',closePanel);
$('pPrev').addEventListener('click',function(){step(-1)});
$('pNext').addEventListener('click',function(){step(1)});
$('tourBtn').addEventListener('click',function(){select('town',true)});
$('freeBtn').addEventListener('click',function(){intro.hidden=true});
addEventListener('keydown',function(e){if(e.key==='Escape'&&sel)closePanel()});
[].forEach.call(document.querySelectorAll('.seg button'),function(b){
  b.addEventListener('click',function(){mode=b.dataset.m;[].forEach.call(document.querySelectorAll('.seg button'),function(x){x.setAttribute('aria-pressed',x===b)});dirty=true});
});
function zoom(f){k=clamp(k*f,fit*.7,2.4);tk=null;dirty=true}
$('zIn').addEventListener('click',function(){zoom(1.25)});$('zOut').addEventListener('click',function(){zoom(.8)});

/* ---------- pointer ---------- */
var ptrs={},drag=null,pinch=null,moved=false,tip=$('tip');
function pdist(){var a=Object.keys(ptrs).map(function(i){return ptrs[i]});return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function toWorld(sx,sy){return[(sx-W/2)/k+camX,(sy-H/2)/k+camY]}
function hitTest(sx,sy){
  var w=toWorld(sx,sy),found=null,bd=-1;
  ORDER.forEach(function(id){var b=B[id];b.polys.forEach(function(p){if(inPoly(p,w)){var d=b.x+b.y+b.w+b.d;if(d>bd){bd=d;found=id}}})});
  return found;
}
cv.addEventListener('pointerdown',function(e){
  try{cv.setPointerCapture(e.pointerId)}catch(x){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;tk=null;
  var n=Object.keys(ptrs).length;
  if(n===1)drag={sx:e.clientX,sy:e.clientY,cx:camX,cy:camY};
  else if(n===2){pinch={d:pdist(),k:k};drag=null}
  cv.classList.add('grabbing');
});
cv.addEventListener('pointermove',function(e){
  if(ptrs[e.pointerId]){ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY}
  var n=Object.keys(ptrs).length;
  if(n>=2&&pinch){k=clamp(pinch.k*pdist()/pinch.d,fit*.7,2.4);moved=true;dirty=true;return}
  if(drag&&n===1){
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(moved){camX=drag.cx-dx/k;camY=drag.cy-dy/k;clampCam();dirty=true}
    return;
  }
  var h=hitTest(e.clientX,e.clientY);
  if(h!==hover){hover=h;dirty=true;cv.classList.toggle('point',!!h)}
  if(h){tip.hidden=false;tip.textContent=B[h].name+' · click to open';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'}else tip.hidden=true;
});
function endPtr(e){
  var was=ptrs[e.pointerId];delete ptrs[e.pointerId];
  var n=Object.keys(ptrs).length;
  if(n<2)pinch=null;
  if(n===0){
    cv.classList.remove('grabbing');
    if(was&&!moved&&e.type==='pointerup'){var h=hitTest(e.clientX,e.clientY);if(h)select(h,true);else if(!intro.hidden&&false)intro.hidden=true}
    drag=null;
  }else if(n===1){var r=ptrs[Object.keys(ptrs)[0]];drag={sx:r.x,sy:r.y,cx:camX,cy:camY}}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',function(){hover=null;tip.hidden=true;cv.classList.remove('point');dirty=true});
cv.addEventListener('wheel',function(e){
  e.preventDefault();var f=Math.exp(-e.deltaY*.0016),nk=clamp(k*f,fit*.7,2.4),w=toWorld(e.clientX,e.clientY);
  camX=w[0]-(e.clientX-W/2)/nk;camY=w[1]-(e.clientY-H/2)/nk;k=nk;tk=null;clampCam();dirty=true;
},{passive:false});

addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
</script>
